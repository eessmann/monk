# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  haskell-nix:
    url: github:input-output-hk/haskell.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:NixOS/nixpkgs/nixos-unstable
  nixpkgs-tools:
    url: github:NixOS/nixpkgs/nixos-unstable
  # Keep the reference shell versions fixed in devenv.lock.
  nixpkgs-reference:
    url: github:NixOS/nixpkgs/nixos-unstable

allow_unfree: true
