name: CI

on:
  pull_request:
    types: [synchronize, opened, reopened]
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  LC_ALL: C
  LANG: C
  NIX_CONFIG: |
    extra-substituters = https://cache.iog.io
    extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=

jobs:
  quality:
    name: Locked lint and formatting tools
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          extra-substituters = https://cache.iog.io
          extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
    - name: Install locked standalone devenv
      run: |
        devenv_nixpkgs_rev=$(python3 -c 'import json; lock=json.load(open("devenv.lock")); print(lock["nodes"][lock["nodes"][lock["root"]]["inputs"]["nixpkgs-tools"]]["locked"]["rev"])')
        nix profile add "github:NixOS/nixpkgs/$devenv_nixpkgs_rev#devenv"
    - run: devenv shell -- monk-quality

  acceptance:
    name: ${{ matrix.compiler }} / Fish ${{ matrix.fish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        compiler: [ghc9141, ghc9122]
        fish: [pinned, moving]
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          extra-substituters = https://cache.iog.io
          extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
    - name: Install locked standalone devenv
      run: |
        devenv_nixpkgs_rev=$(python3 -c 'import json; lock=json.load(open("devenv.lock")); print(lock["nodes"][lock["nodes"][lock["root"]]["inputs"]["nixpkgs-tools"]]["locked"]["rev"])')
        nix profile add "github:NixOS/nixpkgs/$devenv_nixpkgs_rev#devenv"
    - name: Identify the locked execution profile
      run: |
        devenv -O monk.compiler:string '${{ matrix.compiler }}' -O monk.fishChannel:string '${{ matrix.fish }}' shell -- bash -e <<'SCRIPT'
        set -euo pipefail
        mkdir -p artifacts
        {
          ghc --numeric-version
          cabal --numeric-version
          bash --noprofile --norc --version
          fish --no-config --version
          uname -a
          sha256sum devenv.lock cabal.project
        } > artifacts/runtime-evidence.txt
        python3 scripts/reference-runtime-profile.py > artifacts/reference-profile.json
        cabal build all --dry-run --offline
        SCRIPT
    - name: Build, integrate, and check native protocol/publication/API boundaries
      run: devenv -O monk.compiler:string '${{ matrix.compiler }}' -O monk.fishChannel:string '${{ matrix.fish }}' shell -- monk-integration
    - name: Linux execution selectors and fixture admission manifest
      run: |
        devenv -O monk.compiler:string '${{ matrix.compiler }}' -O monk.fishChannel:string '${{ matrix.fish }}' shell -- bash -e <<'SCRIPT'
        set -euo pipefail
        export PATH="$(dirname "$(cabal list-bin exe:monk-runtime)"):$PATH"
        MONK_INTEGRATION=1 timeout 5m cabal test monk-test --test-options="-p '/procsub-output/ || /Planned child isolation/'"
        bash scripts/generate-parity-manifest.sh "$(cabal list-bin exe:monk)" artifacts/parity-manifest.tsv
        SCRIPT
    - name: Build API documentation
      run: devenv -O monk.compiler:string '${{ matrix.compiler }}' -O monk.fishChannel:string '${{ matrix.fish }}' shell -- monk-docs
    - name: Unpacked source build and install smoke
      run: devenv -O monk.compiler:string '${{ matrix.compiler }}' -O monk.fishChannel:string '${{ matrix.fish }}' shell -- monk-sdist
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: acceptance-${{ matrix.compiler }}-fish-${{ matrix.fish }}
        path: |
          artifacts/
          devenv.lock
          cabal.project

  native-runtime:
    name: Portable runtime / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-24.04
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
          - target: aarch64-darwin
            runner: macos-14
    env:
      MONK_PACKAGE_TARGET: ${{ matrix.target }}
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          extra-substituters = https://cache.iog.io
          extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
    - name: Install locked standalone devenv
      run: |
        devenv_nixpkgs_rev=$(python3 -c 'import json; lock=json.load(open("devenv.lock")); print(lock["nodes"][lock["nodes"][lock["root"]]["inputs"]["nixpkgs-tools"]]["locked"]["rev"])')
        nix profile add "github:NixOS/nixpkgs/$devenv_nixpkgs_rev#devenv"
    - name: Inspect the release build plan and cache availability
      run: |
        mkdir -p artifacts
        devenv eval "outputs.runtime.$MONK_PACKAGE_TARGET.drvPath" > artifacts/package-derivation.json
        package_drv=$(python3 -c 'import json; print(next(iter(json.load(open("artifacts/package-derivation.json")).values())))')
        nix build --dry-run --no-link "$package_drv^out" 2>&1 | tee artifacts/package-build-plan.txt
    - name: Build native artifact and enforce architecture/linkage checks
      run: |
        devenv build "outputs.runtime.$MONK_PACKAGE_TARGET" outputs.reference.bash outputs.reference.fish outputs.testPrograms.python outputs.testPrograms.coreutils
        devenv eval "outputs.runtime.$MONK_PACKAGE_TARGET.outPath" outputs.reference.bash.outPath outputs.reference.fish.outPath outputs.testPrograms.python.outPath outputs.testPrograms.coreutils.outPath > artifacts/package-paths.json
        python3 - <<'PY'
        import json, os, pathlib, shutil
        paths = json.load(open('artifacts/package-paths.json'))
        target = os.environ['MONK_PACKAGE_TARGET']
        shutil.copytree(paths[f'outputs.runtime.{target}.outPath'], 'artifacts/runtime')
        reference = pathlib.Path('artifacts/reference-bin')
        reference.mkdir()
        for command in ['bash', 'fish']:
            (reference / command).symlink_to(pathlib.Path(paths[f'outputs.reference.{command}.outPath']) / 'bin' / command)
        for command, package in [('python3', 'python'), ('sha256sum', 'coreutils')]:
            (reference / command).symlink_to(pathlib.Path(paths[f'outputs.testPrograms.{package}.outPath']) / 'bin' / command)
        PY
    - name: Execute copied artifact outside the build shell
      run: |
        runtime="$PWD/artifacts/runtime/bin/monk-runtime"
        reference_path="$PWD/artifacts/reference-bin:/usr/bin:/bin"
        env -i PATH="$reference_path" LC_ALL=C LANG=C "$runtime" --describe > artifacts/runtime-description.txt
        env -i PATH="$reference_path" LC_ALL=C LANG=C python3 runtime-test/protocol.py "$runtime"
        env -i PATH="$reference_path" LC_ALL=C LANG=C python3 runtime-test/portable.py "$runtime"
        env -i PATH="$reference_path" LC_ALL=C LANG=C python3 runtime-test/printf.py "$runtime"
        env -i PATH="$reference_path" LC_ALL=C LANG=C python3 runtime-test/expansion.py "$runtime"
        env -i PATH="$reference_path" LC_ALL=C LANG=C python3 runtime-test/session.py "$runtime"
        for suite in descriptors read process-substitution pattern-parts exec signals direct-output native-launcher; do
          env -i PATH="$reference_path" LC_ALL=C LANG=C python3 "runtime-test/$suite.py" "$runtime"
        done
        env -i PATH="$reference_path" LC_ALL=C LANG=C bash test/native/child-transport.sh "$runtime"
        python3 - <<'PY'
        import json, pathlib
        evidence = pathlib.Path('artifacts/runtime/share/monk/package-evidence.json')
        report = json.loads(evidence.read_text())
        description = pathlib.Path('artifacts/runtime-description.txt').read_text().splitlines()
        assert len(description) == 3 and description[0] == f"monk-runtime {report['abi']} {report['profile']}"
        assert description[2] == 'target ' + report['target']
        report['runtime_description_verified'] = True
        report['runtime_capabilities'] = description[1].split()
        report['execution_verified'] = True
        report['execution_checks'] = ['describe', 'byte-protocol', 'portable-descriptors', 'printf', 'expansion', 'session', 'descriptors', 'read', 'process-substitution', 'pattern-parts', 'exec', 'signals', 'direct-output', 'native-launcher', 'child-transport']
        pathlib.Path('artifacts/native-execution.json').write_text(json.dumps(report, indent=2) + '\n')
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: native-runtime-${{ matrix.target }}
        path: artifacts/
