name: CI

on:
  pull_request:
    types: [synchronize, opened, reopened]
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  LC_ALL: C
  LANG: C
  NIX_CONFIG: |
    extra-substituters = https://cache.iog.io
    extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=

jobs:
  quality:
    name: Locked lint and formatting tools
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          extra-substituters = https://cache.iog.io
          extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
    - name: Install locked standalone devenv
      run: |
        devenv_nixpkgs_rev=$(nix eval --impure --raw --expr 'let lock = builtins.fromJSON (builtins.readFile ./devenv.lock); in (builtins.getAttr (lock.nodes.root.inputs."nixpkgs-tools") lock.nodes).locked.rev')
        nix profile add "github:NixOS/nixpkgs/$devenv_nixpkgs_rev#devenv"
    - run: devenv shell -- monk-quality

  acceptance:
    name: ${{ matrix.compiler }} / Fish ${{ matrix.fish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        compiler: [ghc9141, ghc9122]
        fish: [pinned, moving]
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          extra-substituters = https://cache.iog.io
          extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
    - name: Install locked standalone devenv
      run: |
        devenv_nixpkgs_rev=$(nix eval --impure --raw --expr 'let lock = builtins.fromJSON (builtins.readFile ./devenv.lock); in (builtins.getAttr (lock.nodes.root.inputs."nixpkgs-tools") lock.nodes).locked.rev')
        nix profile add "github:NixOS/nixpkgs/$devenv_nixpkgs_rev#devenv"
    - name: Identify the locked execution profile
      run: |
        devenv -O monk.compiler:string '${{ matrix.compiler }}' -O monk.fishChannel:string '${{ matrix.fish }}' shell -- bash -e <<'SCRIPT'
        set -euo pipefail
        mkdir -p artifacts
        {
          ghc --numeric-version
          cabal --numeric-version
          bash --noprofile --norc --version
          fish --no-config --version
          uname -a
          sha256sum devenv.lock cabal.project
        } > artifacts/runtime-evidence.txt
        cabal build exe:monk-tool
        "$(cabal list-bin exe:monk-tool)" evidence profile > artifacts/reference-profile.json
        cabal build all --dry-run --offline
        SCRIPT
    - name: Build, integrate, and check native protocol/publication/API boundaries
      run: devenv -O monk.compiler:string '${{ matrix.compiler }}' -O monk.fishChannel:string '${{ matrix.fish }}' shell -- monk-integration
    - name: Linux execution selectors and fixture admission manifest
      run: |
        devenv -O monk.compiler:string '${{ matrix.compiler }}' -O monk.fishChannel:string '${{ matrix.fish }}' shell -- bash -e <<'SCRIPT'
        set -euo pipefail
        export PATH="$(dirname "$(cabal list-bin exe:monk-runtime)"):$PATH"
        MONK_INTEGRATION=1 timeout 5m cabal test monk-test --test-options="-p '/procsub-output/ || /Planned child isolation/'"
        bash scripts/generate-parity-manifest.sh "$(cabal list-bin exe:monk)" artifacts/parity-manifest.tsv
        SCRIPT
    - name: Build API documentation
      run: devenv -O monk.compiler:string '${{ matrix.compiler }}' -O monk.fishChannel:string '${{ matrix.fish }}' shell -- monk-docs
    - name: Unpacked source build and install smoke
      run: devenv -O monk.compiler:string '${{ matrix.compiler }}' -O monk.fishChannel:string '${{ matrix.fish }}' shell -- monk-sdist
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: acceptance-${{ matrix.compiler }}-fish-${{ matrix.fish }}
        path: |
          artifacts/
          devenv.lock
          cabal.project

  native-runtime:
    name: Portable runtime / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-24.04
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
          - target: aarch64-darwin
            runner: macos-14
    env:
      MONK_PACKAGE_TARGET: ${{ matrix.target }}
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          extra-substituters = https://cache.iog.io
          extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
    - name: Install locked standalone devenv
      run: |
        devenv_nixpkgs_rev=$(nix eval --impure --raw --expr 'let lock = builtins.fromJSON (builtins.readFile ./devenv.lock); in (builtins.getAttr (lock.nodes.root.inputs."nixpkgs-tools") lock.nodes).locked.rev')
        nix profile add "github:NixOS/nixpkgs/$devenv_nixpkgs_rev#devenv"
    - name: Inspect the release build plan and cache availability
      run: |
        mkdir -p artifacts
        devenv eval "outputs.runtime.$MONK_PACKAGE_TARGET.drvPath" > artifacts/package-derivation.json
        package_drv=$(nix eval --impure --raw --expr 'builtins.head (builtins.attrValues (builtins.fromJSON (builtins.readFile ./artifacts/package-derivation.json)))')
        nix build --dry-run --no-link "$package_drv^out" 2>&1 | tee artifacts/package-build-plan.txt
    - name: Build native artifact and enforce architecture/linkage checks
      run: |
        devenv build "outputs.runtime.$MONK_PACKAGE_TARGET" outputs.reference.bash outputs.reference.fish outputs.testPrograms.coreutils outputs.tooling
        devenv eval "outputs.runtime.$MONK_PACKAGE_TARGET.outPath" outputs.reference.bash.outPath outputs.reference.fish.outPath outputs.testPrograms.coreutils.outPath outputs.tooling.outPath > artifacts/package-paths.json
        output_path() {
          MONK_OUTPUT_KEY="$1" nix eval --impure --raw --expr 'let paths = builtins.fromJSON (builtins.readFile ./artifacts/package-paths.json); in builtins.getAttr (builtins.getEnv "MONK_OUTPUT_KEY") paths'
        }
        cp -R "$(output_path "outputs.runtime.$MONK_PACKAGE_TARGET.outPath")" artifacts/runtime
        mkdir -p artifacts/reference-bin
        ln -s "$(output_path outputs.reference.bash.outPath)/bin/bash" artifacts/reference-bin/bash
        ln -s "$(output_path outputs.reference.fish.outPath)/bin/fish" artifacts/reference-bin/fish
        ln -s "$(output_path outputs.testPrograms.coreutils.outPath)/bin/sha256sum" artifacts/reference-bin/sha256sum
        ln -s "$(output_path outputs.tooling.outPath)/bin/monk-tool" artifacts/reference-bin/monk-tool
    - name: Execute copied artifact outside the build shell
      run: |
        runtime="$PWD/artifacts/runtime/bin/monk-runtime"
        reference_path="$PWD/artifacts/reference-bin:/usr/bin:/bin"
        case "$(uname -s)" in Darwin) temp_root=/private/tmp;; *) temp_root=/tmp;; esac
        env -i PATH="$reference_path" LC_ALL=C LANG=C TMPDIR="$temp_root" "$runtime" --describe > artifacts/runtime-description.txt
        mkdir -p artifacts/native-checks
        for suite in protocol portable printf expansion session descriptors read process-substitution pattern-parts exec signals direct-output native-launcher; do
          env -i PATH="$reference_path" LC_ALL=C LANG=C TMPDIR="$temp_root" \
            artifacts/reference-bin/monk-tool runtime check --suite "$suite" --runtime "$runtime" \
              --report "artifacts/native-checks/$suite.json"
        done
        env -i PATH="$reference_path" LC_ALL=C LANG=C TMPDIR="$temp_root" \
          artifacts/reference-bin/monk-tool runtime check --suite child-transport --runtime "$runtime" \
            --report artifacts/native-checks/child-transport.json
        artifacts/reference-bin/monk-tool runtime attest \
          --package-report artifacts/runtime/share/monk/package-evidence.json \
          --binary "$runtime" \
          --description-file artifacts/runtime-description.txt \
          --check-receipts artifacts/native-checks \
          --output artifacts/native-execution.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: native-runtime-${{ matrix.target }}
        path: artifacts/
