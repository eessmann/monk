[package]
name = "monk-runtime"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
description = "Native ABI 2 runtime for generated Monk Fish programs"
license = "MIT"
publish = false

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive"] }
libc = "0.2"
nix = { version = "=0.31.3", features = ["fs", "process", "signal", "socket", "term", "uio", "user"] }
rustix = { version = "=1.1.5", features = ["event", "fs", "net", "pipe", "process", "thread"] }
tempfile = "3"

[[bin]]
name = "monk-runtime"
path = "src/main.rs"

[dev-dependencies]
trybuild = "1"
